name: Publicar Posts de Imagen

# ============================================================
#  2 Posts de imagen/dia (cada corrida hace AMBOS canales). UTC (CO = UTC-5).
#    Imagen #1  09:30 CO = 14:30 UTC
#    Imagen #2  18:00 CO = 23:00 UTC
# ============================================================

on:
  workflow_dispatch:
  schedule:
    - cron: '30 14 * * *'
    - cron: '0 23 * * *'

concurrency:
  group: image-posts
  cancel-in-progress: false

jobs:
  publicar-posts-imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Instalar fuente para los titulos
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation

      - name: Reconstruir credenciales desde Secrets
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
        run: printf '%s' "$ACCOUNTS_JSON" > accounts.json

      - name: Generar y publicar Posts de Imagen (ambos canales)
        env:
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: node generate-image-post.js

      - name: Guardar el historial de temas actualizado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Actualizar historial de temas (imagenes) [skip ci]"
          git push || echo "Nada que pushear o push fallo (no critico)"
