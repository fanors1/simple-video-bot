name: Publicar Posts de Imagen

on:
  workflow_dispatch:
    inputs:
      cuenta:
        description: 'Cuenta a correr (curious4d, canal2, oscuro4d, vive4d, o vacio)'
        required: false
        default: ''
  schedule:
    - cron: '10 13 * * *'
    - cron: '45 17 * * *'
    - cron: '20 22 * * *'
    - cron: '55 2 * * *'

concurrency:
  group: image-posts
  cancel-in-progress: false

jobs:
  publicar-posts-imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Instalar fuente para los titulos
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-montserrat

      - name: Reconstruir credenciales desde Secrets
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
        run: printf '%s' "$ACCOUNTS_JSON" > accounts.json

      - name: Generar y publicar Posts de Imagen
        env:
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          TIKTOK_ENABLED: ${{ vars.TIKTOK_ENABLED || 'true' }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          CRON: ${{ github.event.schedule }}
          CUENTA_MANUAL: ${{ inputs.cuenta }}
        run: |
          if [ -n "$CUENTA_MANUAL" ]; then
            CUENTA="$CUENTA_MANUAL"
          else
            case "$CRON" in
              "10 13 * * *")  CUENTA="curious4d" ;;
              "45 17 * * *")  CUENTA="canal2" ;;
              "20 22 * * *")  CUENTA="oscuro4d" ;;
              "55 2 * * *")  CUENTA="vive4d" ;;
              *)             CUENTA="" ;;
            esac
          fi
          echo "Corriendo post de imagen de cuenta: $CUENTA (cron: $CRON)"
          node generate-image-post.js "$CUENTA"

      - name: Guardar el historial de temas actualizado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          git diff --staged --quiet && echo "Nada que guardar" && exit 0
          git commit -m "Actualizar historial de temas (imagenes) [skip ci]"
          git pull --rebase --autostash origin main || true
          git push || echo "No se pudo hacer push"
          echo "Historial guardado"
