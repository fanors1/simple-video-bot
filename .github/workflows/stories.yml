name: Publicar Historias

on:
  workflow_dispatch:
    inputs:
      cuenta:
        description: 'Cuenta a correr (curious4d, canal2, oscuro4d, vive4d, o vacio)'
        required: false
        default: ''
  schedule:
    - cron: '0 9 * * *'
    - cron: '25 9 * * *'
    - cron: '40 10 * * *'
    - cron: '55 11 * * *'
    - cron: '0 14 * * *'
    - cron: '15 15 * * *'
    - cron: '55 16 * * *'
    - cron: '35 18 * * *'
    - cron: '15 20 * * *'
    - cron: '55 21 * * *'
    - cron: '0 0 * * *'
    - cron: '40 1 * * *'

concurrency:
  group: stories
  cancel-in-progress: false

jobs:
  publicar-historias:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Instalar fuente para los titulos
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-montserrat

      - name: Reconstruir credenciales desde Secrets
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
        run: printf '%s' "$ACCOUNTS_JSON" > accounts.json

      - name: Generar y publicar Historias
        env:
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          TIKTOK_ENABLED: ${{ vars.TIKTOK_ENABLED || 'true' }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          CRON: ${{ github.event.schedule }}
          CUENTA_MANUAL: ${{ inputs.cuenta }}
        run: |
          if [ -n "$CUENTA_MANUAL" ]; then
            CUENTA="$CUENTA_MANUAL"
          else
            case "$CRON" in
              "0 9 * * *")  CUENTA="curious4d" ;;
              "25 9 * * *")  CUENTA="canal2" ;;
              "40 10 * * *")  CUENTA="oscuro4d" ;;
              "55 11 * * *")  CUENTA="vive4d" ;;
              "0 14 * * *")  CUENTA="curious4d" ;;
              "15 15 * * *")  CUENTA="canal2" ;;
              "55 16 * * *")  CUENTA="oscuro4d" ;;
              "35 18 * * *")  CUENTA="vive4d" ;;
              "15 20 * * *")  CUENTA="curious4d" ;;
              "55 21 * * *")  CUENTA="canal2" ;;
              "0 0 * * *")  CUENTA="oscuro4d" ;;
              "40 1 * * *")  CUENTA="vive4d" ;;
              *)             CUENTA="" ;;
            esac
          fi
          echo "Corriendo historia de cuenta: $CUENTA (cron: $CRON)"
          node generate-story.js "$CUENTA"

      - name: Guardar el historial de temas actualizado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          git diff --staged --quiet && echo "Nada que guardar" && exit 0
          git commit -m "Actualizar historial de temas (historias) [skip ci]"
          git pull --rebase --autostash origin main || true
          git push || echo "No se pudo hacer push"
          echo "Historial guardado"
