name: Publicar Historias

# ============================================================
#  2 Historias/dia (cada corrida hace AMBOS canales). UTC (CO = UTC-5).
#    Historia #1  06:00 CO = 11:00 UTC  (prioridad: arranca el dia)
#    Historia #2  15:00 CO = 20:00 UTC
# ============================================================

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 20 * * *'

concurrency:
  group: stories
  cancel-in-progress: false

jobs:
  publicar-historias:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Instalar fuente para los titulos
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation

      - name: Reconstruir credenciales desde Secrets
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
        run: printf '%s' "$ACCOUNTS_JSON" > accounts.json

      - name: Generar y publicar Historias (ambos canales)
        env:
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: node generate-story.js

      - name: Guardar el historial de temas actualizado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          git diff --staged --quiet && echo "Nada que guardar" && exit 0
          git commit -m "Actualizar historial de temas (historias) [skip ci]"
          for intento in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && echo "Historial guardado" && exit 0
            echo "Choque de push (intento $intento), reintentando..."
            sleep $((RANDOM % 10 + 3))
          done
          echo "No se pudo guardar el historial tras varios intentos (no critico)"
