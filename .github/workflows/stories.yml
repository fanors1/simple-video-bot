name: Publicar Historias

on:
  workflow_dispatch:
    inputs:
      cuenta:
        description: 'Cuenta a correr (vacio = todas)'
        required: false
        default: ''
  schedule:
    - cron: '20 9 * * *'
    - cron: '10 11 * * *'
    - cron: '0 14 * * *'
    - cron: '50 15 * * *'
    - cron: '40 17 * * *'
    - cron: '30 19 * * *'
    - cron: '20 21 * * *'
    - cron: '15 22 * * *'
    - cron: '10 23 * * *'

concurrency:
  group: stories
  cancel-in-progress: false

jobs:
  publicar-historias:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Instalar fuente para los titulos
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-montserrat

      - name: Reconstruir credenciales desde Secrets
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
        run: printf '%s' "$ACCOUNTS_JSON" > accounts.json

      - name: Generar y publicar Historias
        env:
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          CRON: ${{ github.event.schedule }}
          CUENTA_MANUAL: ${{ inputs.cuenta }}
        run: |
          if [ -n "$CUENTA_MANUAL" ]; then
            CUENTA="$CUENTA_MANUAL"
          else
            case "$CRON" in
              "20 9 * * *")  CUENTA="curious4d" ;;
              "10 11 * * *") CUENTA="canal2" ;;
              "0 14 * * *")  CUENTA="oscuro4d" ;;
              "50 15 * * *") CUENTA="curious4d" ;;
              "40 17 * * *") CUENTA="canal2" ;;
              "30 19 * * *") CUENTA="oscuro4d" ;;
              "20 21 * * *") CUENTA="curious4d" ;;
              "15 22 * * *") CUENTA="canal2" ;;
              "10 23 * * *") CUENTA="oscuro4d" ;;
              *)             CUENTA="" ;;
            esac
          fi
          echo "Corriendo historia de cuenta: $CUENTA (cron: $CRON)"
          node generate-story.js "$CUENTA"

      - name: Guardar el historial de temas actualizado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          git diff --staged --quiet && echo "Nada que guardar" && exit 0
          git commit -m "Actualizar historial de temas (historias) [skip ci]"
          for intento in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && echo "Historial guardado" && exit 0
            echo "Choque de push (intento $intento), reintentando..."
            sleep $((RANDOM % 10 + 3))
          done
          echo "No se pudo guardar el historial tras varios intentos (no critico)"
