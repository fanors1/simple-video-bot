name: Publicar Reels

on:
  workflow_dispatch:
    inputs:
      cuenta:
        description: 'Cuenta a correr (curious4d, canal2, o vacio para ambas)'
        required: false
        default: ''
  schedule:
    - cron: '0 8 * * *'
    - cron: '55 8 * * *'
    - cron: '50 9 * * *'
    - cron: '45 10 * * *'
    - cron: '40 11 * * *'
    - cron: '35 12 * * *'
    - cron: '30 13 * * *'
    - cron: '25 14 * * *'
    - cron: '20 15 * * *'
    - cron: '15 16 * * *'
    - cron: '10 17 * * *'
    - cron: '5 18 * * *'
    - cron: '0 19 * * *'
    - cron: '55 19 * * *'
    - cron: '50 20 * * *'
    - cron: '45 21 * * *'
    - cron: '40 22 * * *'
    - cron: '35 23 * * *'

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  publicar-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Instalar fuente para los titulos
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-montserrat

      - name: Reconstruir credenciales desde Secrets
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_CANAL2_JSON: ${{ secrets.YOUTUBE_TOKEN_CANAL2_JSON }}
          YOUTUBE_TOKEN_OSCURO4D_JSON: ${{ secrets.YOUTUBE_TOKEN_OSCURO4D_JSON }}
        run: |
          printf '%s' "$ACCOUNTS_JSON" > accounts.json
          if [ -n "$YOUTUBE_CREDENTIALS_JSON" ]; then printf '%s' "$YOUTUBE_CREDENTIALS_JSON" > youtube-credentials.json; fi
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then printf '%s' "$YOUTUBE_TOKEN_JSON" > youtube-token.json; fi
          if [ -n "$YOUTUBE_TOKEN_CANAL2_JSON" ]; then mkdir -p accounts/canal2 && printf '%s' "$YOUTUBE_TOKEN_CANAL2_JSON" > accounts/canal2/youtube-token.json; fi
          if [ -n "$YOUTUBE_TOKEN_OSCURO4D_JSON" ]; then mkdir -p accounts/oscuro4d && printf '%s' "$YOUTUBE_TOKEN_OSCURO4D_JSON" > accounts/oscuro4d/youtube-token.json; fi

      - name: Generar y publicar Reels
        env:
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          SEGMENT_COUNT: '7'
          CRON: ${{ github.event.schedule }}
          CUENTA_MANUAL: ${{ inputs.cuenta }}
        run: |
          if [ -n "$CUENTA_MANUAL" ]; then
            CUENTA="$CUENTA_MANUAL"
          else
            case "$CRON" in
              "0 8 * * *")   CUENTA="curious4d" ;;
              "55 8 * * *")  CUENTA="canal2" ;;
              "50 9 * * *")  CUENTA="oscuro4d" ;;
              "45 10 * * *") CUENTA="curious4d" ;;
              "40 11 * * *") CUENTA="canal2" ;;
              "35 12 * * *") CUENTA="oscuro4d" ;;
              "30 13 * * *") CUENTA="curious4d" ;;
              "25 14 * * *") CUENTA="canal2" ;;
              "20 15 * * *") CUENTA="oscuro4d" ;;
              "15 16 * * *") CUENTA="curious4d" ;;
              "10 17 * * *") CUENTA="canal2" ;;
              "5 18 * * *")  CUENTA="oscuro4d" ;;
              "0 19 * * *")  CUENTA="curious4d" ;;
              "55 19 * * *") CUENTA="canal2" ;;
              "50 20 * * *") CUENTA="oscuro4d" ;;
              "45 21 * * *") CUENTA="curious4d" ;;
              "40 22 * * *") CUENTA="canal2" ;;
              "35 23 * * *") CUENTA="oscuro4d" ;;
              *)             CUENTA="" ;;
            esac
          fi
          echo "Corriendo cuenta: $CUENTA (cron: $CRON)"
          node generate-random.js "" "$CUENTA"

      - name: Guardar el historial de temas actualizado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          git diff --staged --quiet && echo "Nada que guardar" && exit 0
          git commit -m "Actualizar historial de temas (reels) [skip ci]"
          for intento in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && echo "Historial guardado" && exit 0
            echo "Choque de push (intento $intento), reintentando..."
            sleep $((RANDOM % 10 + 3))
          done
          echo "No se pudo guardar el historial tras varios intentos (no critico)"
