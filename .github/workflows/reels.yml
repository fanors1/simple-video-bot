name: Publicar Reels

on:
  workflow_dispatch:
    inputs:
      cuenta:
        description: 'Cuenta a correr (curious4d, canal2, oscuro4d, vive4d, o vacio)'
        required: false
        default: ''
  schedule:
    - cron: '21 9 * * *'
    - cron: '42 9 * * *'
    - cron: '25 10 * * *'
    - cron: '7 11 * * *'
    - cron: '28 11 * * *'
    - cron: '11 12 * * *'
    - cron: '53 12 * * *'
    - cron: '56 13 * * *'
    - cron: '39 14 * * *'
    - cron: '0 15 * * *'
    - cron: '42 15 * * *'
    - cron: '25 16 * * *'
    - cron: '46 16 * * *'
    - cron: '28 17 * * *'
    - cron: '32 18 * * *'
    - cron: '14 19 * * *'
    - cron: '35 19 * * *'
    - cron: '18 20 * * *'
    - cron: '0 21 * * *'
    - cron: '21 21 * * *'
    - cron: '4 22 * * *'
    - cron: '46 22 * * *'
    - cron: '7 23 * * *'
    - cron: '49 23 * * *'
    - cron: '32 0 * * *'
    - cron: '53 0 * * *'
    - cron: '35 1 * * *'
    - cron: '18 2 * * *'

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  publicar-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Instalar fuente para los titulos
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-montserrat

      - name: Reconstruir credenciales desde Secrets
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_CANAL2_JSON: ${{ secrets.YOUTUBE_TOKEN_CANAL2_JSON }}
          YOUTUBE_TOKEN_OSCURO4D_JSON: ${{ secrets.YOUTUBE_TOKEN_OSCURO4D_JSON }}
          YOUTUBE_TOKEN_VIVE4D_JSON: ${{ secrets.YOUTUBE_TOKEN_VIVE4D_JSON }}
        run: |
          printf '%s' "$ACCOUNTS_JSON" > accounts.json
          if [ -n "$YOUTUBE_CREDENTIALS_JSON" ]; then printf '%s' "$YOUTUBE_CREDENTIALS_JSON" > youtube-credentials.json; fi
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then printf '%s' "$YOUTUBE_TOKEN_JSON" > youtube-token.json; fi
          if [ -n "$YOUTUBE_TOKEN_CANAL2_JSON" ]; then mkdir -p accounts/canal2 && printf '%s' "$YOUTUBE_TOKEN_CANAL2_JSON" > accounts/canal2/youtube-token.json; fi
          if [ -n "$YOUTUBE_TOKEN_OSCURO4D_JSON" ]; then mkdir -p accounts/oscuro4d && printf '%s' "$YOUTUBE_TOKEN_OSCURO4D_JSON" > accounts/oscuro4d/youtube-token.json; fi
          if [ -n "$YOUTUBE_TOKEN_VIVE4D_JSON" ]; then mkdir -p accounts/vive4d && printf '%s' "$YOUTUBE_TOKEN_VIVE4D_JSON" > accounts/vive4d/youtube-token.json; fi

      - name: Generar y publicar Reels
        env:
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          TIKTOK_ENABLED: ${{ vars.TIKTOK_ENABLED || 'true' }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_ACCOUNT_CURIOUS4D: ${{ secrets.ZERNIO_ACCOUNT_CURIOUS4D }}
          ZERNIO_ACCOUNT_HIPOTESIS4D: ${{ secrets.ZERNIO_ACCOUNT_HIPOTESIS4D }}
          ZERNIO_ACCOUNT_OSCURO4D: ${{ secrets.ZERNIO_ACCOUNT_OSCURO4D }}
          ZERNIO_ACCOUNT_VIVE4D: ${{ secrets.ZERNIO_ACCOUNT_VIVE4D }}
          SEGMENT_COUNT: '7'
          CRON: ${{ github.event.schedule }}
          CUENTA_MANUAL: ${{ inputs.cuenta }}
        run: |
          if [ -n "$CUENTA_MANUAL" ]; then
            CUENTA="$CUENTA_MANUAL"
          else
            case "$CRON" in
              "21 9 * * *")  CUENTA="curious4d" ;;
              "42 9 * * *")  CUENTA="canal2" ;;
              "25 10 * * *")  CUENTA="oscuro4d" ;;
              "7 11 * * *")  CUENTA="vive4d" ;;
              "28 11 * * *")  CUENTA="curious4d" ;;
              "11 12 * * *")  CUENTA="canal2" ;;
              "53 12 * * *")  CUENTA="oscuro4d" ;;
              "56 13 * * *")  CUENTA="vive4d" ;;
              "39 14 * * *")  CUENTA="curious4d" ;;
              "0 15 * * *")  CUENTA="canal2" ;;
              "42 15 * * *")  CUENTA="oscuro4d" ;;
              "25 16 * * *")  CUENTA="vive4d" ;;
              "46 16 * * *")  CUENTA="curious4d" ;;
              "28 17 * * *")  CUENTA="canal2" ;;
              "32 18 * * *")  CUENTA="oscuro4d" ;;
              "14 19 * * *")  CUENTA="vive4d" ;;
              "35 19 * * *")  CUENTA="curious4d" ;;
              "18 20 * * *")  CUENTA="canal2" ;;
              "0 21 * * *")  CUENTA="oscuro4d" ;;
              "21 21 * * *")  CUENTA="vive4d" ;;
              "4 22 * * *")  CUENTA="curious4d" ;;
              "46 22 * * *")  CUENTA="canal2" ;;
              "7 23 * * *")  CUENTA="oscuro4d" ;;
              "49 23 * * *")  CUENTA="vive4d" ;;
              "32 0 * * *")  CUENTA="curious4d" ;;
              "53 0 * * *")  CUENTA="canal2" ;;
              "35 1 * * *")  CUENTA="oscuro4d" ;;
              "18 2 * * *")  CUENTA="vive4d" ;;
              *)             CUENTA="" ;;
            esac
          fi
          echo "Corriendo cuenta: $CUENTA (cron: $CRON)"
          node generate-random.js "" "$CUENTA"

      - name: Guardar el historial de temas actualizado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          git diff --staged --quiet && echo "Nada que guardar" && exit 0
          git commit -m "Actualizar historial de temas (reels) [skip ci]"
          git pull --rebase --autostash origin main || true
          git push || echo "No se pudo hacer push"
          echo "Historial guardado"
