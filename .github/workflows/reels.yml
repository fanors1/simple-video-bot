name: Publicar Reels

on:
  workflow_dispatch:
    inputs:
      cuenta:
        description: 'Cuenta a correr (curious4d, canal2, o vacio para ambas)'
        required: false
        default: ''
  schedule:
    - cron: '30 9 * * *'
    - cron: '30 12 * * *'
    - cron: '30 15 * * *'
    - cron: '30 18 * * *'
    - cron: '30 21 * * *'
    - cron: '30 0 * * *'

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  publicar-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Instalar fuente para los titulos
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-montserrat

      - name: Reconstruir credenciales desde Secrets
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_CANAL2_JSON: ${{ secrets.YOUTUBE_TOKEN_CANAL2_JSON }}
        run: |
          printf '%s' "$ACCOUNTS_JSON" > accounts.json
          if [ -n "$YOUTUBE_CREDENTIALS_JSON" ]; then printf '%s' "$YOUTUBE_CREDENTIALS_JSON" > youtube-credentials.json; fi
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then printf '%s' "$YOUTUBE_TOKEN_JSON" > youtube-token.json; fi
          if [ -n "$YOUTUBE_TOKEN_CANAL2_JSON" ]; then mkdir -p accounts/canal2 && printf '%s' "$YOUTUBE_TOKEN_CANAL2_JSON" > accounts/canal2/youtube-token.json; fi

      - name: Generar y publicar Reels
        env:
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          SEGMENT_COUNT: '7'
        run: node generate-random.js "" "${{ inputs.cuenta }}"

      - name: Guardar el historial de temas actualizado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          git diff --staged --quiet && echo "Nada que guardar" && exit 0
          git commit -m "Actualizar historial de temas (reels) [skip ci]"
          for intento in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && echo "Historial guardado" && exit 0
            echo "Choque de push (intento $intento), reintentando..."
            sleep $((RANDOM % 10 + 3))
          done
          echo "No se pudo guardar el historial tras varios intentos (no critico)"
